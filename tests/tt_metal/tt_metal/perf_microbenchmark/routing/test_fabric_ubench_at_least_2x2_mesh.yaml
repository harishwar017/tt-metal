allocation_policies:
    receiver:
      max_configs_per_core: 4

Tests:
  ### NEIGHBOR EXCHANGE BANDWIDTH TESTS ###
  - name: "NeighborExchangeUnicast"
    enable_flow_control: true
    fabric_setup:
      topology: NeighborExchange
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: unicast
      num_packets: 100000

    patterns:
      - type: neighbor_exchange

  ### LINEAR BANDWIDTH TESTS ###
  - name: "LinearMulticast"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: mcast
      num_packets: 20000

    patterns:
      - type: all_to_all
        iterations: 3

  - name: "UnidirLinearMulticast"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: mcast
      num_packets: 20000

    patterns:
      - type: unidirectional_linear
        iterations: 3

  - name: "SingleSenderLinearUnicastAllDevices"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: unicast
      num_packets: 20000

    patterns:
      - type: one_to_all
        iterations: 3

  - name: "NeighborExchangeLinear"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: unicast
      num_packets: 20000

    patterns:
      - type: neighbor_exchange
        iterations: 3



  ### RING BANDWIDTH TESTS ###
  # Full Ring Multicast and Unicast tests have more variation in bandwidth, so we run them for extra iterations
  - name: "FullRingMulticast"
    enable_flow_control: true
    fabric_setup:
      topology: Ring
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: mcast
      num_packets: 100000

    patterns:
      - type: full_ring
        iterations: 3

  - name: "FullRingUnicast"
    enable_flow_control: true
    fabric_setup:
      topology: Ring
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: unicast
      num_packets: 100000

    patterns:
      - type: full_ring
        iterations: 3

  - name: "HalfRingMulticast"
    enable_flow_control: true
    fabric_setup:
      topology: Ring
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: mcast
      num_packets: 100000

    patterns:
      - type: half_ring
        iterations: 3


  ## MESH BANDWIDTH TESTS ###
  - name: "MeshMulticast"
    enable_flow_control: true
    fabric_setup:
      topology: Mesh
      mesh_descriptor_path: "tests/tt_metal/tt_fabric/custom_mesh_descriptors/galaxy_1x32_mesh_graph_descriptor.textproto"

    parametrization_params:
      num_links: [4]
      ntype: [unicast_write]
      size: [4096]

    defaults:
      ftype: mcast
      num_packets: 20000

    patterns:
      - type: all_to_all
        iterations: 3

